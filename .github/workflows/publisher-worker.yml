name: Publisher Worker

on:
  # GitHub throttles scheduled runs hard — "*/15" has been landing closer to
  # every 2.5 hours in practice, so a post built at 11am could sit unqueued
  # until mid afternoon. Pushing the slides is the last step of building a post,
  # so treat that push as the signal: the worker runs seconds later and the
  # draft is in TikTok before the notification goes out. The cron stays as a
  # safety net for anything queued without a media push.
  push:
    paths:
      - "media/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POSTING_API_URL: ${{ secrets.POSTING_API_URL }}
          POSTING_API_KEY: ${{ secrets.POSTING_API_KEY }}
